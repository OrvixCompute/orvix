name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Monday 00:00 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # audit both packages even if one has findings
      matrix:
        include:
          - name: orchestrator
            req: orchestrator/requirements.txt
          - name: node
            req: orvix-node/requirements.txt
    name: audit-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Gating step: pip-audit exits non-zero if any known vulnerability is found
      # (and, with --strict, if any dependency could not be audited). pip-audit
      # has no native severity-level gating, so this fails on ANY vulnerability —
      # stricter than HIGH/CRITICAL-only. To relax later, parse the JSON output
      # below and gate on a severity allowlist instead.
      #
      # Documented exceptions (re-check whenever this list is touched):
      #
      #   PYSEC-2026-1325 — ecdsa 0.19.2, Minerva timing attack on P-256.
      #     Reached only transitively, via python-jose[cryptography]. Not
      #     exploitable here: the sole JWT path signs and verifies with HS256
      #     (symmetric HMAC, app/config.py JWT_ALGORITHM), and Solana signing
      #     goes through solders (ed25519, Rust) — nothing in the tree calls
      #     ecdsa's P-256 sign/keygen/ECDH. Upstream considers side-channel
      #     attacks out of scope and has no planned fix, so there is no version
      #     to upgrade to. REMOVE THIS IGNORE if JWT_ALGORITHM ever moves to an
      #     ES* curve, or if python-jose is swapped for a library that uses
      #     ecdsa directly. Tracked follow-up: migrate off python-jose (largely
      #     unmaintained) to PyJWT, which drops the ecdsa dependency entirely.
      - name: Audit ${{ matrix.name }} (human-readable, gating)
        run: pip-audit --requirement ${{ matrix.req }} --desc --strict --ignore-vuln PYSEC-2026-1325

      # Always produce a JSON report as a build artifact (even when the gate fails).
      - name: Audit ${{ matrix.name }} (JSON report)
        if: always()
        run: pip-audit --requirement ${{ matrix.req }} --format json --output ${{ matrix.name }}-audit.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-audit
          path: ${{ matrix.name }}-audit.json
          if-no-files-found: ignore
