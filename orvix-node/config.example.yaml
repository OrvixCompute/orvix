# Example Orvix Node configuration.
# Copy to ~/.orvix/config.yaml (Linux/Mac) or %APPDATA%/orvix/config.yaml (Windows),
# or run `orvix-node config init` to generate it.

# --- Required ---
provider_id: "your-provider-id"     # from POST /v1/provider/register
node_secret: "your-node-secret"     # keep private

# --- Identity (optional) ---
# Leave unset and the node generates one on first run, caching it in a `node-id`
# file next to this config so reconnects reuse the same row in the orchestrator's
# node list. Set it explicitly only to pin a machine to a known id.
# node_id: ""

# --- Connection ---
orchestrator_url: "wss://api.orvix.xyz"   # local dev: ws://localhost:8000
model: "qwen-2.5-7b"

# --- Runtime ---
heartbeat_interval: 15
health_port: 9000
max_concurrent_jobs: 4       # chat jobs in flight at once
max_concurrent_image_jobs: 1 # image jobs are capped separately (VRAM per pass)
backend: "mock"            # "mock" or "vllm"
# Tool calling: vLLM only parses tool calls when the server is started with
#   --enable-auto-tool-choice --tool-call-parser <parser>
# Pick the parser for your model family (hermes for Qwen2.5, llama3_json for
# Llama 3, mistral for Mistral, ...). Without these flags the model answers in
# prose and the tools are ignored. Set them via ORVIX_NODE_VLLM_SERVE_CMD.

# --- Logging ---
log_level: "INFO"
json_logs: false
# log_file: ""             # default: ~/.orvix/logs/node.log
