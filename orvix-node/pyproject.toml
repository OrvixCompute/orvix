[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orvix-node"
# Read from orvix_node/version.py, which already calls itself the single source
# of truth. It was not: this file carried its own copy, and the two stayed in
# step only by luck. A drifted pair means the node reports one version at
# registration and ships another to PyPI.
dynamic = ["version"]
description = "Orvix Node Software — run GPU compute for the Orvix decentralized AI network."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Orvix" }]
keywords = ["gpu", "inference", "llm", "solana", "decentralized", "openai-compatible"]
# Shown on the PyPI page. Providers are asked to install this on a machine with a
# GPU and a wallet-derived secret, so the listing needs to link back to the source
# they can read before trusting it.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "click>=8.1",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://orvix.network"
Repository = "https://github.com/OrvixCompute/orvix"
Issues = "https://github.com/OrvixCompute/orvix/issues"
Documentation = "https://github.com/OrvixCompute/orvix/blob/main/orvix-node/README.md"

[project.optional-dependencies]
# Real GPU inference. Linux + CUDA only.
gpu = ["pynvml>=11.5", "vllm>=0.5"]
# Image generation (Diffusers-backed; Flux Schnell also supported). Linux + CUDA only, heavy.
image = [
    "diffusers>=0.31.0",
    "transformers>=4.44.0",
    "accelerate>=0.34.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25",
    "Pillow>=10.0",
]
# GPU detection without vLLM (works for monitoring on any NVIDIA box).
nvml = ["pynvml>=11.5"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
orvix-node = "orvix_node.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "orvix_node.version.__version__" }

[tool.setuptools.packages.find]
include = ["orvix_node*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Pinned lint surface. `ruff check` with no config uses whatever the installed
# ruff version happens to default to — ruff 0.16 widened that set and turned a
# previously-green tree into hundreds of findings. Declaring the rules explicitly
# means a version bump changes behaviour only when we ask it to.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's classic default set: pycodestyle errors + pyflakes.
select = ["E4", "E7", "E9", "F"]
